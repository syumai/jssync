name = "jssync"
main = "src/worker.ts"
compatibility_date = "2024-12-18"
compatibility_flags = ["nodejs_compat"]
workers_dev = false
preview_urls = false

# Served on the custom domain only; the workers.dev subdomain is disabled.
routes = [
  { pattern = "jssync.syumai.dev", custom_domain = true }
]

# Development configuration
[vars]
ENVIRONMENT = "development"

# Static assets configuration
[assets]
directory = "./public"
binding = "ASSETS"

# Durable Objects bindings
[durable_objects]
bindings = [
  { name = "JSSYNC_ROOMS", class_name = "JSSyncDurableObject" }
]

# Durable Objects migrations
[[migrations]]
tag = "v1"
new_sqlite_classes = ["JSSyncDurableObject"]

# JavaScript sandbox runtime Worker (see sandbox/)
[[services]]
binding = "JAVASCRIPT"
service = "jssync-sandbox-javascript"

# Build configuration
[build]
command = "pnpm run build"
